<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Daily Reports · Animal facility</title>
<!-- DRS Lite — daily reporting for animal-facility field staff. Look: GRC v2 component kit (app/tokens.css, app/type.css, kit/kit.css).
     One file, no build, works offline. Data stays on this device (localStorage) until the ANTS connector is wired in (see ANTS below). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Reports">
<style>
/* ---------- tokens: the GRC v2 colour + spacing set this app uses (values from app/tokens.css) ---------- */
:root {
  --md3-primary: #37BD69; --md3-on-primary: #FFFFFF; --md3-on-primary-container: #1F515B;
  --md3-secondary-container: #AFEFEB; --md3-on-secondary-container: #1F415B;
  --md3-tertiary: #FA6140; --md3-tertiary-container: #FFBDA8; --md3-on-tertiary-container: #250E01;
  --md3-error: #E93353; --md3-error-container: #FFD3D3; --md3-on-error-container: #4A0415;
  --md3-background: #EFF5F2; --md3-on-background: #E1F9ED; --md3-surface: #F2FFF8; --md3-on-surface: #006D35;
  --md3-surface-variant: #DAE7DF; --md3-on-surface-variant: #44544A; --md3-outline: #839D8D; --md3-outline-variant: #C3CEC7;
  --md3-displaybg-primary: #E8F4F2; --md3-notes: #FCF4AE; --md3-moderate-secondary: #E4B819; --md3-neutral-primary: #000000;
  --md3-notes-a40: rgba(252, 244, 174, .4);
  --md3-secondary-container-a30: rgba(175, 239, 235, .3);
  --md3-tertiary-container-a30: rgba(255, 189, 168, .3);
  --md3-on-primary-container-a60: rgba(31, 81, 91, .6);
  --md3-neutral-primary-a20: rgba(0, 0, 0, .2);
  --black-08: rgba(0, 0, 0, .08);
  --sp-2: 2px; --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-24: 24px; --sp-32: 32px;
  --k-gutter: var(--sp-16);
  --tap: 48px; /* field use: every tap target is at least 48px, a step up from the kit's 44 */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--md3-background); color: var(--md3-on-surface-variant); }
button { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }

/* ---------- type: the Antz text styles (app/type.css) ---------- */
.t-stat-title   { font-size: 28px; font-weight: 600; }
.t-major-title  { font-size: 24px; font-weight: 600; }
.t-medium-medium{ font-size: 20px; font-weight: 500; }
.t-minor-title  { font-size: 16px; font-weight: 600; }
.t-minor-medium { font-size: 16px; font-weight: 500; }
.t-minor-regular{ font-size: 16px; font-weight: 400; }
.t-body-title   { font-size: 14px; font-weight: 600; }
.t-body-medium  { font-size: 14px; font-weight: 500; letter-spacing: .1px; }
.t-body-regular { font-size: 14px; font-weight: 400; }
.t-subtext-title{ font-size: 12px; font-weight: 600; }
.t-subtext-regular { font-size: 12px; font-weight: 400; }
.t-small        { font-size: 10px; font-weight: 500; }

/* ---------- shell ---------- */
.app { max-width: 760px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
main { flex: 1; padding: 0 var(--k-gutter) calc(96px + env(safe-area-inset-bottom)); }
.stack { display: flex; flex-direction: column; gap: var(--sp-12); }
.gap24 { display: flex; flex-direction: column; gap: var(--sp-24); padding-top: var(--sp-16); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-12); margin: 0 0 var(--sp-8); }
.quiet { color: var(--md3-on-surface-variant); }
.muted { color: var(--md3-outline); }
.svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.svg--sm { width: 20px; height: 20px; }

/* C-07 page header band */
.k-ph { display: flex; align-items: center; gap: var(--sp-12); margin: 0 calc(-1 * var(--k-gutter)); padding: calc(var(--sp-24) + env(safe-area-inset-top)) var(--k-gutter) var(--sp-16);
  background: var(--md3-on-primary); border-bottom: 1px solid var(--md3-surface-variant); }
.k-ph__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
.k-ph__line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4) var(--sp-8); }
.k-ph__line > span + span::before { content: '·'; margin-right: var(--sp-8); }
.k-ph__back { width: var(--tap); height: var(--tap); flex: none; margin-left: calc(-1 * var(--sp-12)); display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--md3-on-surface); cursor: pointer; }
.k-ph--sticky { position: sticky; top: 0; z-index: 5; }
.who { display: flex; align-items: center; gap: var(--sp-8); height: var(--tap); padding: 0 var(--sp-12) 0 var(--sp-4); border: 1px solid var(--md3-outline-variant); border-radius: 999px; background: var(--md3-on-primary); cursor: pointer; flex: none; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--md3-on-primary-container); color: var(--md3-on-primary); flex: none; }

/* buttons (N-01) */
.k-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-8); height: var(--tap); padding: 0 var(--sp-16); border-radius: 8px;
  border: 1px solid var(--md3-outline-variant); background: var(--md3-on-primary); color: var(--md3-on-surface-variant); white-space: nowrap; cursor: pointer; }
.k-btn--primary { background: var(--md3-on-primary-container); border-color: var(--md3-on-primary-container); color: var(--md3-on-primary); }
.k-btn--brand { background: var(--md3-primary); border-color: var(--md3-primary); color: var(--md3-on-primary); }
.k-btn--danger { color: var(--md3-error); }
.k-btn--alert { background: var(--md3-error); border-color: var(--md3-error); color: var(--md3-on-error, #fff); }
.k-btn--ghost { background: transparent; border-color: transparent; }
.k-btn--block { width: 100%; }
.k-btn--lg { height: 56px; }
.k-btn:disabled { background: var(--md3-surface-variant); border-color: var(--md3-surface-variant); color: var(--md3-on-surface-variant); cursor: not-allowed; }
.k-btn--dashed { border-style: dashed; border-color: var(--md3-outline); background: transparent; color: var(--md3-on-surface); }

/* C-19 pills · C-21 tags */
.k-pill { display: inline-flex; align-items: center; gap: var(--sp-4); height: 28px; padding: 0 var(--sp-12); border-radius: 999px; white-space: nowrap; background: var(--md3-displaybg-primary); color: var(--md3-on-surface-variant); }
.k-pill--ok { background: var(--md3-on-background); color: var(--md3-on-surface); }
.k-pill--info { background: var(--md3-secondary-container-a30); color: var(--md3-on-secondary-container); }
.k-pill--warn { background: var(--md3-notes-a40); color: var(--md3-on-tertiary-container); }
.k-pill--bad { background: var(--md3-error-container); color: var(--md3-on-error-container); }
.k-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--sp-8); border-radius: 4px; background: var(--md3-displaybg-primary); color: var(--md3-on-surface-variant); white-space: nowrap; }
.k-tag--safety { background: var(--md3-notes-a40); color: var(--md3-on-tertiary-container); }

/* C-10 row card */
.k-rowcard { display: flex; align-items: center; gap: var(--sp-16); width: 100%; min-height: 72px; padding: var(--sp-16); border: 1px solid var(--md3-surface-variant); border-radius: 8px;
  background: var(--md3-on-primary); color: var(--md3-on-surface-variant); text-align: left; cursor: pointer; }
.k-rowcard:active { background: var(--md3-surface); }
.k-rowcard__ico { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--md3-displaybg-primary); color: var(--md3-on-primary-container); }
.k-rowcard__ico--bad { background: var(--md3-error-container); color: var(--md3-on-error-container); }
.k-rowcard__ico--ok { background: var(--md3-on-background); color: var(--md3-on-surface); }
.k-rowcard__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
.k-rowcard__meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rowline { display: flex; align-items: center; gap: var(--sp-8); min-width: 0; }
.rowline .k-pill { height: 24px; padding: 0 var(--sp-8); }
.k-rowcard__side { flex: none; display: flex; align-items: center; gap: var(--sp-8); color: var(--md3-outline); }
.k-rowcard--sub { min-height: 56px; padding: var(--sp-12) var(--sp-16); }

/* C-15 card · C-17 tiles · C-24 ring */
.k-card { background: var(--md3-on-primary); border: 1px solid var(--md3-surface-variant); border-radius: 8px; }
.k-card--pad { padding: var(--sp-16); }
.hero { display: flex; align-items: center; gap: var(--sp-16); }
.k-ring { position: relative; width: 72px; height: 72px; display: grid; place-items: center; flex: none; }
.k-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.k-ring__track { stroke: var(--md3-surface-variant); }
.k-ring__arc { stroke: var(--md3-primary); transition: stroke-dashoffset .4s; }
.k-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-8); }
.k-tile { display: flex; flex-direction: column; gap: var(--sp-4); padding: var(--sp-12); border-radius: 8px; background: var(--md3-background); }
.k-tile__n { font-variant-numeric: tabular-nums; color: var(--md3-on-surface-variant); }
.k-num--bad { color: var(--md3-error); }

/* C-28 segmented control */
.k-seg { display: flex; gap: var(--sp-4); padding: var(--sp-4); border-radius: 8px; background: var(--md3-displaybg-primary); }
.k-seg__b { flex: 1; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-8); padding: 0 var(--sp-12); border: 0; border-radius: 6px; background: none; color: var(--md3-on-surface-variant); white-space: nowrap; cursor: pointer; }
.k-seg__b.is-on { background: var(--md3-on-primary-container); color: var(--md3-on-primary); }
.k-seg__b.is-on.is-bad { background: var(--md3-error); }

/* C-49 form, step bar, fields, chip choice */
.k-steps { display: flex; gap: var(--sp-4); margin: var(--sp-12) 0 0; padding: 0; list-style: none; }
.k-steps__s { flex: 1; min-width: 0; height: 6px; border-radius: 999px; background: var(--md3-surface-variant); border: 0; padding: 0; cursor: pointer; position: relative; }
.k-steps__s::after { content: ''; position: absolute; inset: -12px 0; }
.k-steps__s.is-done { background: var(--md3-primary); }
.k-steps__s.is-cur { background: var(--md3-on-surface); }
.k-steps__s.is-bad { background: var(--md3-error); }
.k-form__sec { display: flex; flex-direction: column; gap: var(--sp-24); padding: var(--sp-24) 0; }
.k-field { display: flex; flex-direction: column; gap: var(--sp-8); }
.k-field__l { display: flex; align-items: baseline; gap: var(--sp-8); color: var(--md3-on-surface-variant); }
.k-field__l .req { color: var(--md3-error); }
.k-field.is-missing .k-field__l { color: var(--md3-error); }
.k-choice { display: flex; flex-wrap: wrap; gap: var(--sp-8); }
.k-chip { display: inline-flex; align-items: center; gap: var(--sp-8); min-height: var(--tap); padding: var(--sp-8) var(--sp-16); border: 1px solid var(--md3-outline-variant); border-radius: 8px;
  background: var(--md3-on-primary); color: var(--md3-on-surface-variant); text-align: left; cursor: pointer; }
.k-chip.is-on { background: var(--md3-surface); border-color: var(--md3-primary); color: var(--md3-on-surface); box-shadow: inset 0 0 0 1px var(--md3-primary); }
.k-chip.is-on.is-bad { background: var(--md3-error-container); border-color: var(--md3-error); color: var(--md3-on-error-container); box-shadow: inset 0 0 0 1px var(--md3-error); }
.k-chip .svg { width: 18px; height: 18px; }
.yn { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: var(--sp-8); }
.yn .k-chip { justify-content: center; min-height: 56px; text-align: center; }
/* single choice = radio buttons; multi choice = buttons with a tick box */
.radios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-8); }
.radios--1 { grid-template-columns: minmax(0, 1fr); }
.k-opt--sm { min-height: 52px; padding: var(--sp-8) var(--sp-12); gap: var(--sp-12); }
.k-opt.is-on.is-bad { border-color: var(--md3-error); background: var(--md3-error-container); color: var(--md3-on-error-container); }
.k-opt.is-on.is-bad .k-radio { border-color: var(--md3-error); }
.k-chip .tick { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 4px; border: 2px solid var(--md3-outline); color: transparent; }
.k-chip .tick .svg { width: 14px; height: 14px; stroke-width: 3; }
.k-chip.is-on .tick { background: var(--md3-on-surface); border-color: var(--md3-on-surface); color: var(--md3-on-primary); }
.k-chip.is-on.is-bad .tick { background: var(--md3-error); border-color: var(--md3-error); }
.more-link { align-self: flex-start; padding-left: 0; color: var(--md3-on-surface); }
/* voice: record a message or speak to type */
.voice { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-8); }
.voice .k-btn { height: auto; min-height: 56px; min-width: 0; padding: var(--sp-8); white-space: normal; text-align: center; line-height: 1.2; }
.voice .k-btn:only-child { grid-column: 1 / -1; }
.k-opt--sm .k-radio { width: 22px; height: 22px; }
.k-opt--sm.is-on .k-radio { border-width: 7px; }
.k-btn--rec { background: var(--md3-error); border-color: var(--md3-error); color: #fff; grid-column: 1 / -1; }
.k-btn--live { background: var(--md3-on-primary-container); border-color: var(--md3-on-primary-container); color: var(--md3-on-primary); }
.recdot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.clips { display: flex; flex-direction: column; gap: var(--sp-8); }
.clip { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8) var(--sp-8) var(--sp-8) var(--sp-12); border: 1px solid var(--md3-surface-variant); border-radius: 8px; background: var(--md3-on-primary); }
.clip audio { flex: 1; min-width: 0; height: 40px; }
.clip .k-btn { width: 44px; padding: 0; flex: none; }
.txtrow { display: flex; gap: var(--sp-8); align-items: flex-start; }
.txtrow .k-inp { flex: 1; }
.txtrow .k-btn { width: var(--tap); padding: 0; flex: none; }
.k-inp.is-live { border-color: var(--md3-on-primary-container); box-shadow: inset 0 0 0 1px var(--md3-on-primary-container); }
.sum-clips { display: flex; flex-direction: column; gap: var(--sp-8); margin-top: var(--sp-8); }
.sum-clips audio { width: 100%; height: 40px; }
.k-inp { width: 100%; min-height: var(--tap); padding: var(--sp-12) var(--sp-16); border: 1px solid var(--md3-outline-variant); border-radius: 8px; background: var(--md3-on-primary); color: var(--md3-on-surface-variant); font: inherit; outline: none; }
.k-inp:focus { border-color: var(--md3-primary); box-shadow: inset 0 0 0 1px var(--md3-primary); }
textarea.k-inp { min-height: 96px; resize: vertical; }
.k-sel { display: flex; align-items: center; gap: var(--sp-12); text-align: left; cursor: pointer; min-height: 56px; }
.k-sel__v { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.k-sel.is-empty .k-sel__v { color: var(--md3-outline); }
.timebox { display: flex; gap: var(--sp-8); }
.timebox .k-sel { flex: 1; }
.timebox__v { font-variant-numeric: tabular-nums; }
.stepper { display: inline-flex; align-items: center; gap: var(--sp-4); padding: var(--sp-4); border-radius: 8px; background: var(--md3-displaybg-primary); align-self: flex-start; }
.stepper button { width: var(--tap); height: var(--tap); border: 0; border-radius: 6px; background: var(--md3-on-primary); color: var(--md3-on-surface); display: grid; place-items: center; cursor: pointer; }
.stepper output { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; color: var(--md3-on-surface-variant); }

/* C-48 option rows (tick/radio) */
.k-opts { display: flex; flex-direction: column; gap: var(--sp-8); }
.k-opt { display: flex; align-items: center; gap: var(--sp-12); width: 100%; min-height: 60px; padding: var(--sp-12) var(--sp-16); border: 1px solid var(--md3-surface-variant); border-radius: 8px;
  background: var(--md3-on-primary); color: var(--md3-on-surface-variant); text-align: left; cursor: pointer; }
.k-opt.is-on { border-color: var(--md3-primary); background: var(--md3-surface); }
.k-opt__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.k-opt__side { flex: none; display: flex; align-items: center; gap: var(--sp-8); }
.k-box { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 6px; border: 2px solid var(--md3-outline); background: var(--md3-on-primary); color: transparent; }
.k-opt.is-on .k-box, .k-box.is-on { background: var(--md3-on-surface); border-color: var(--md3-on-surface); color: var(--md3-on-primary); }
.k-box .svg { width: 18px; height: 18px; stroke-width: 3; }
.k-radio { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid var(--md3-outline); background: var(--md3-on-primary); }
.k-opt.is-on .k-radio { border: 7px solid var(--md3-on-surface); }
.k-opt--done .k-opt__main .t-minor-medium { text-decoration: line-through; text-decoration-color: var(--md3-outline); }

/* checklist rows: label + OK / Concern */
.audit { display: flex; flex-direction: column; border: 1px solid var(--md3-surface-variant); border-radius: 8px; background: var(--md3-on-primary); overflow: hidden; }
.audit__row { display: flex; align-items: center; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16); border-top: 1px solid var(--md3-surface-variant); flex-wrap: wrap; }
.audit__row:first-child { border-top: 0; }
.audit__row > span { flex: 1 1 200px; min-width: 0; }
.audit__row .k-seg { flex: 0 0 auto; min-width: 220px; }
.audit__row.is-bad { background: var(--md3-error-container); }
.owe-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-8) var(--sp-12); padding: var(--sp-12) var(--sp-16); border-top: 1px solid var(--md3-surface-variant); }
.owe-row:first-child { border-top: 0; }
.owe-row .avatar { width: 32px; height: 32px; }
.owe-row__who { flex: 1 1 140px; min-width: 0; }
.bar-tools { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); flex-wrap: wrap; }

/* animal cards (roster) */
.ani { display: flex; flex-direction: column; gap: var(--sp-12); padding: var(--sp-16); border: 1px solid var(--md3-surface-variant); border-radius: 8px; background: var(--md3-on-primary); }
.ani.is-bad { border-color: var(--md3-error); }
.ani.is-ok { border-color: var(--md3-primary); }
.ani__h { display: flex; align-items: center; gap: var(--sp-12); }
.ani__grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-8) var(--sp-12); }
.ani__grid .k-seg__b { padding: 0 var(--sp-8); }
.ani__cap { display: block; margin-bottom: var(--sp-4); }

/* repeat groups */
.grp { display: flex; flex-direction: column; gap: var(--sp-16); padding: var(--sp-16); border: 1px solid var(--md3-surface-variant); border-radius: 8px; background: var(--md3-on-primary); }
.grp__h { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); }
.grp .k-field__l { color: var(--md3-on-surface-variant); }

/* C-59 summary list */
.k-kv { display: grid; grid-template-columns: minmax(110px, 40%) minmax(0, 1fr); gap: var(--sp-12) var(--sp-16); margin: 0; }
.k-kv dt, .k-kv dd { margin: 0; }
.k-kv dd.is-bad { color: var(--md3-error); }
.k-kv dd.is-miss { color: var(--md3-error); font-style: italic; }
.sum-sec { display: flex; flex-direction: column; gap: var(--sp-12); }
.sum-sec + .sum-sec { border-top: 1px solid var(--md3-surface-variant); padding-top: var(--sp-16); }
.sum-item { padding: var(--sp-12); border-radius: 8px; background: var(--md3-background); }
.flagbox { display: flex; gap: var(--sp-12); padding: var(--sp-16); border-radius: 8px; background: var(--md3-error-container); color: var(--md3-on-error-container); }
.flagbox ul { margin: var(--sp-4) 0 0; padding-left: var(--sp-16); }
.okbox { display: flex; gap: var(--sp-12); align-items: center; padding: var(--sp-16); border-radius: 8px; background: var(--md3-on-background); color: var(--md3-on-surface); }

/* C-62 empty */

/* C-06 action bar, C-01 tab bar */
.k-actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; }
.k-actionbar__in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: var(--sp-12); padding: var(--sp-12) var(--k-gutter) calc(var(--sp-12) + env(safe-area-inset-bottom));

.k-tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--md3-on-primary); box-shadow: 0 -1px 0 var(--md3-surface-variant); padding-bottom: env(safe-area-inset-bottom); }
.k-tabbar__in { max-width: 760px; margin: 0 auto; display: flex; padding: 0 var(--sp-8); }

.k-tabbar__item.is-on { color: var(--md3-on-surface); border-top-color: var(--md3-primary); }

.k-scrim { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: var(--md3-on-primary-container-a60); }

.k-sheet__f { flex: none; display: flex; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16) calc(var(--sp-12) + env(safe-area-inset-bottom)); background: var(--md3-on-primary); box-shadow: 0 -4px 10px var(--black-08); }

.grid-h .k-chip { justify-content: center; padding: 0; font-variant-numeric: tabular-nums; }
.grp-l { margin: var(--sp-8) 0 0; }

.brand { display: flex; align-items: center; gap: var(--sp-12); }
.brand__mark { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--md3-primary); color: var(--md3-on-primary); }

@media (max-width: 420px) {

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

        <span class="role__ico">${ico(r.icon)}</span><span><span class="t-minor-title" style="display:block">${r.l}</span><span class="t-subtext-regular quiet">${r.d}</span></span></button>`).join("")}</div></section>
    ${OB.role ? `<section><div class="sec-h"><h2 class="t-minor-title">2 · Who are you?</h2></div>
      <div class="k-opts">${people.map(s => `<button class="k-opt ${OB.uid === s.uid ? "is-on" : ""}" data-a="obWho" data-v="${s.uid}"><span class="avatar t-body-title">${initials(s.name)}</span>
        <span class="k-opt__main"><span class="t-minor-medium">${esc(s.name)}</span><span class="t-subtext-regular quiet">${s.uid} · ${esc(site(s.site).name)} · ${esc(zoneOf(s.site, s.zone).name)}</span></span><span class="k-radio"></span></button>`).join("")}</div></section>` : ""}
    ${p ? `<section><div class="sec-h"><h2 class="t-minor-title">3 · Your zone today</h2></div>
      <div class="k-choice">${site(p.site).zones.map(z => `<button class="k-chip ${(OB.zone || p.zone) === z.code ? "is-on" : ""}" data-a="obZone" data-v="${z.code}">${esc(z.name)}</button>`).join("")}</div></section>` : ""}
  </div>`;
  $("bar").innerHTML = `<div class="k-actionbar"><div class="k-actionbar__in"><button class="k-btn k-btn--primary t-minor-medium" data-a="obGo" ${p ? "" : "disabled"}>Start reporting</button></div></div>`;
}

/* ---------- home: today's reports for my role ---------- */
function renderHome() {
  const m = me(), s = meStaff(), role = ROLES[m.role];
  const daily = role.forms.filter(f => FORMS[f].per === "day");
  const sent = daily.filter(f => todays(f).some(r => r.status === "sent")).length;
  const pct = daily.length ? Math.round(sent / daily.length * 100) : 0;
  const todayAll = mine().filter(r => r.date === TODAY());
  const flags = todayAll.filter(r => r.status === "sent").reduce((n, r) => n + flagsOf(r).length, 0);
  const C = 2 * Math.PI * 30;
  const card = f => {
    const F = FORMS[f], rs = todays(f), last = rs[0];
    if (F.per === "day") {
      const n = last ? withR(last, () => missingIn(F, last.data).length) : null;
      return `<button class="k-rowcard" data-a="${last ? "open" : "new"}" data-v="${last ? last.id : f}">
        <span class="k-rowcard__ico ${last && last.status === "sent" ? "k-rowcard__ico--ok" : ""}">${ico(last && last.status === "sent" ? "check" : F.icon)}</span>
        <span class="k-rowcard__main"><span class="k-rowcard__t t-minor-title">${F.title}</span><span class="rowline">${statusPill(last)}<span class="k-rowcard__meta t-body-regular quiet">${!last ? "Once a day" : last.status === "sent" ? "at " + new Date(last.sentAt).toTimeString().slice(0, 5) : n ? n + " answer" + (n > 1 ? "s" : "") + " left" : "Ready to send"}</span></span></span>
        <span class="k-rowcard__side">${ico("chev")}</span></button>`;
    }
    return `<div class="stack" style="gap:8px">
      <button class="k-rowcard" data-a="new" data-v="${f}"><span class="k-rowcard__ico ${F.urgent ? "k-rowcard__ico--bad" : ""}">${ico(F.icon)}</span>
        <span class="k-rowcard__main"><span class="k-rowcard__t t-minor-title">${F.title}</span><span class="k-rowcard__meta t-body-regular quiet">${rs.length ? rs.length + " today" : "As many as needed"}</span></span>
        <span class="k-rowcard__side"><span class="k-pill k-pill--info t-body-medium">${ico("plus", "svg--sm")}New</span></span></button>
      ${rs.map(r => `<button class="k-rowcard k-rowcard--sub" data-a="open" data-v="${r.id}" style="margin-left:24px;width:calc(100% - 24px)">
        <span class="k-rowcard__main"><span class="k-rowcard__t t-body-title">${esc(subtitle(r))}</span><span class="k-rowcard__meta t-subtext-regular quiet">${new Date(r.created).toTimeString().slice(0, 5)}</span></span>
        <span class="k-rowcard__side">${statusPill(r)}${ico("chev", "svg--sm")}</span></button>`).join("")}</div>`;
  };
  const urgent = role.forms.includes("inc");
  $("main").innerHTML = `<header class="k-ph"><div class="k-ph__main"><h1 class="t-major-title" style="color:var(--md3-on-surface)">${longDay()}</h1>
      <p class="k-ph__line t-body-regular"><span>${esc(site(m.site).name)}</span><span>${esc(zoneOf(m.site, m.zone).name)}</span></p></div>
      <button class="who" data-a="go" data-v="profile" aria-label="Profile: ${esc(s.name)}"><span class="avatar t-body-title">${initials(s.name)}</span><span class="t-body-medium">${esc(s.name.split(" ").slice(-1)[0])}</span></button></header>
    <div class="gap24">
      <section class="k-card k-card--pad stack" style="gap:16px">
        <div class="hero"><div class="k-ring" role="img" aria-label="${pct}% of daily reports sent"><svg width="72" height="72" viewBox="0 0 72 72"><circle class="k-ring__track" cx="36" cy="36" r="30" fill="none" stroke-width="8"/><circle class="k-ring__arc" cx="36" cy="36" r="30" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C - C * pct / 100}"/></svg><span class="t-minor-title" style="position:relative;color:var(--md3-on-surface)">${pct}%</span></div>
          <div class="stack" style="gap:4px"><p class="t-minor-title">${sent === daily.length && daily.length ? "All daily reports sent" : `${daily.length - sent} daily report${daily.length - sent === 1 ? "" : "s"} to send`}</p><p class="t-body-regular quiet">${role.l} · ${ROLES[m.role].d}</p></div></div>
        <div class="k-tiles"><div class="k-tile"><span class="t-subtext-regular">Sent today</span><span class="k-tile__n t-stat-title">${todayAll.filter(r => r.status === "sent").length}</span></div>
          <div class="k-tile"><span class="t-subtext-regular">Drafts</span><span class="k-tile__n t-stat-title">${todayAll.filter(r => r.status === "draft").length}</span></div>
          <div class="k-tile"><span class="t-subtext-regular">Flags raised</span><span class="k-tile__n t-stat-title ${flags ? "k-num--bad" : ""}">${flags}</span></div></div>
      </section>
      ${urgent ? `<button class="k-btn k-btn--alert k-btn--block k-btn--lg t-minor-title" data-a="new" data-v="inc">${ico("alert")}Report an incident now</button>` : ""}
      <section><div class="sec-h"><h2 class="t-minor-title">Daily reports</h2></div><div class="stack">${daily.map(card).join("")}</div></section>
      ${role.forms.filter(f => FORMS[f].per === "event" && f !== "inc").length ? `<section><div class="sec-h"><h2 class="t-minor-title">When needed</h2></div><div class="stack">${role.forms.filter(f => FORMS[f].per === "event" && f !== "inc").map(card).join("")}</div></section>` : ""}
      ${todays("inc").length ? `<section><div class="sec-h"><h2 class="t-minor-title">Incidents today</h2></div><div class="stack">${card("inc")}</div></section>` : ""}
    </div>`;
  $("bar").innerHTML = tabbar("home");
}
function subtitle(r) {
  const d = r.data;
  if (r.form === "bio") return [d.w && d.w.encl && labelOf("encl", d.w.encl), d.w && d.w.type].filter(Boolean).join(" · ") || "New check";
  if (r.form === "shift") return (d.a && d.a.animal ? labelOf("animal", d.a.animal) : "New move") + (d.a && d.a.status ? " · " + d.a.status : "");
  if (r.form === "special") return (d.d && d.d.duty) || "New special duty";
  if (r.form === "inc") return [(d.w && d.w.type) || "New incident", d.w && d.w.sev].filter(Boolean).join(" · ");
  return FORMS[r.form].title;
}

/* ---------- form: one section per step ---------- */
function renderForm() {
  const r = report(VIEW.id); if (!r) return go({ name: "home" });
  const F = FORMS[r.form], si = VIEW.step || 0, S = F.sections[si], scope = r.data[S.k] || {};
  const miss = missingIn(F, r.data);
  const steps = F.sections.map((s, i) => { const m = miss.some(x => x.si === i); const touched = r.data[s.k] && Object.keys(r.data[s.k]).length;
    return `<button class="k-steps__s ${i === si ? "is-cur" : !m && touched ? "is-done" : VIEW.tried && m ? "is-bad" : ""}" data-a="step" data-v="${i}" aria-label="Step ${i + 1}: ${esc(s.l)}"></button>`; }).join("");
  $("main").innerHTML = `<header class="k-ph k-ph--sticky"><div class="k-ph__main"><div style="display:flex;align-items:center;gap:4px">
      <button class="k-ph__back" data-a="go" data-v="home" aria-label="Back to today">${ico("back")}</button>
      <div style="min-width:0"><p class="t-subtext-regular quiet">${F.title} · step ${si + 1} of ${F.sections.length}</p><h1 class="t-medium-medium" style="color:var(--md3-on-surface)">${S.l}</h1></div></div>
      <div class="k-steps">${steps}</div></div></header>
    <div class="k-form__sec">${S.hint ? `<p class="t-body-regular quiet" style="margin-bottom:-8px">${S.hint}</p>` : ""}
      ${S.fields.filter(f => visible(f, scope)).map(f => fieldHTML(f, S.k + "/" + f.k, scope[f.k], r)).join("")}</div>`;
  const last = si === F.sections.length - 1;
  $("bar").innerHTML = `<div class="k-actionbar"><div class="k-actionbar__in">
    ${si > 0 ? `<button class="k-btn t-minor-medium" data-a="step" data-v="${si - 1}" aria-label="Previous step">${ico("back")}</button>` : ""}
    <button class="k-btn k-btn--primary t-minor-medium" data-a="${last ? "review" : "step"}" data-v="${last ? r.id : si + 1}">${last ? "Review & send" : "Next"}${ico(last ? "check" : "chev")}</button></div></div>`;
  hydrateClips();
}

function fieldHTML(f, p, v, r) {
  const scopeData = r.data;
  const miss = VIEW.tried && f.req && isEmpty(f, v, scopeData);
  const lab = f.l ? `<div class="k-field__l t-body-title">${esc(f.l)}${f.req ? '<span class="req" aria-label="required">*</span>' : '<span class="t-subtext-regular muted">optional</span>'}</div>` : "";
  const wrap = inner => `<div class="k-field ${miss ? "is-missing" : ""}">${lab}${inner}</div>`;
  const chip = (val, on, bad, act, extra) => `<button class="k-chip t-minor-medium ${on ? "is-on" : ""} ${on && bad ? "is-bad" : ""}" data-a="${act}" data-p="${p}" data-v="${esc(val)}" aria-pressed="${!!on}" ${extra || ""}>${act === "multi" || act === "phrase" ? `<span class="tick">${ico("check")}</span>` : ""}${esc(val)}</button>`;
  const radio = (val, label, sub, on, bad) => `<button class="k-opt k-opt--sm ${on ? "is-on" : ""} ${on && bad ? "is-bad" : ""}" data-a="seg" data-p="${p}" data-v="${esc(val)}" role="radio" aria-checked="${!!on}"><span class="k-radio"></span>
    <span class="k-opt__main"><span class="t-minor-medium">${esc(label)}</span>${sub ? `<span class="t-subtext-regular quiet">${esc(sub)}</span>` : ""}</span></button>`;
  const tickRow = (val, label, sub, on) => `<button class="k-opt k-opt--sm ${on ? "is-on" : ""}" data-a="multi" data-p="${p}" data-v="${esc(val)}" aria-pressed="${!!on}"><span class="k-box">${ico("check")}</span>
    <span class="k-opt__main"><span class="t-minor-medium">${esc(label)}</span>${sub ? `<span class="t-subtext-regular quiet">${esc(sub)}</span>` : ""}</span></button>`;
  const other = () => v === "Other" ? fieldHTML({ t: "text", k: "_o", l: "Describe ‘Other’", req: 1 }, p + "_o", getP(r.data, p + "_o"), r) : "";
  switch (f.t) {
    case "seg": {
      const big = f.o.length <= 3 && f.o.every(o => o.length <= 16);
      return wrap((big ? `<div class="yn" style="--n:${f.o.length}" role="radiogroup">${f.o.map(o => chip(o, v === o, (f.bad || []).includes(o), "seg", 'role="radio"')).join("")}</div>`
        : `<div class="radios" role="radiogroup">${f.o.map(o => radio(o, o, "", v === o, (f.bad || []).includes(o))).join("")}</div>`)) + other();
    }
    case "yn": return wrap(`<div class="yn" role="radiogroup">${YN.map(o => chip(o, v === o, (f.bad || []).includes(o), "seg", 'role="radio"')).join("")}</div>`);
    case "multi": return wrap(`<p class="t-subtext-regular quiet" style="margin-top:-4px">Tap all that apply</p><div class="k-choice">${f.o.map(o => chip(o, (v || []).includes(o), (f.bad || []).includes(o), "multi")).join("")}</div>`);
    case "text": {
      const live = DICT && DICT.p === p;
      return wrap(`<div class="txtrow"><input class="k-inp t-minor-regular ${live ? "is-live" : ""}" data-a="txt" data-p="${p}" value="${esc(v || "")}" placeholder="${esc(live ? "Listening… speak now" : f.ph || "Type here")}" autocomplete="off">
        ${SR ? `<button class="k-btn ${live ? "k-btn--live" : ""}" data-a="dict" data-p="${p}" aria-label="${live ? "Stop speaking" : "Speak to type"}">${ico(live ? "stop" : "mic")}</button>` : ""}</div>`);
    }
    case "check": return `<button class="k-opt ${v ? "is-on" : ""} ${miss ? "is-missing" : ""}" data-a="check" data-p="${p}" aria-pressed="${!!v}" ${miss ? 'style="border-color:var(--md3-error)"' : ""}><span class="k-box">${ico("check")}</span><span class="k-opt__main"><span class="t-minor-medium">${esc(f.l)}${f.req ? ' <span style="color:var(--md3-error)">*</span>' : ""}</span></span></button>`;
    case "time": return wrap(`<div class="timebox"><button class="k-inp k-sel ${v ? "" : "is-empty"}" data-a="time" data-p="${p}">${ico("clock")}<span class="k-sel__v t-minor-medium timebox__v">${v || "Tap to set time"}</span>${ico("down", "svg--sm")}</button>
      <button class="k-btn t-body-medium" data-a="now" data-p="${p}">Now</button></div>`);
    case "num": return wrap(`<div class="stepper"><button data-a="num" data-p="${p}" data-v="-1" aria-label="Less">${ico("minus")}</button><output class="t-medium-medium">${v || 0}</output><button data-a="num" data-p="${p}" data-v="1" aria-label="More">${ico("plus")}</button></div>`);
    case "pick": {
      /* my zone inline as radio / tick rows; anything else on the site through the sheet */
      const vals = f.multi ? (v || []) : (v ? [v] : []), near = pickOpts(f.src, true), all = pickOpts(f.src, false);
      const rows = near.concat(vals.filter(x => !near.some(o => o[0] === x)).map(x => [x, labelOf(f.src, x), "Other zone"]));
      return wrap(`${f.multi ? '<p class="t-subtext-regular quiet" style="margin-top:-4px">Tap all that apply</p>' : ""}<div class="radios radios--1" ${f.multi ? "" : 'role="radiogroup"'}>${rows.map(([id, t, sub]) => f.multi ? tickRow(id, t, sub, vals.includes(id)) : radio(id, t, sub, v === id)).join("")}</div>
        ${all.length > near.length ? `<button class="k-btn k-btn--ghost t-body-medium more-link" data-a="pick" data-p="${p}">${ico("search", "svg--sm")}${f.src === "staff" ? "Someone else on this site" : "Other zones on this site"}</button>` : ""}`);
    }
    case "note": {
      const n = v || {}, tp = p + "/txt", recOn = REC && REC.p === p, live = DICT && DICT.p === tp;
      const voice = recOn ? `<button class="k-btn k-btn--rec k-btn--block t-minor-medium" style="height:56px" data-a="recStop"><span class="recdot"></span>Recording <span data-rec-t>0:00</span> · tap to stop</button>`
        : `<div class="voice">${CAN_REC ? `<button class="k-btn t-minor-medium" data-a="rec" data-p="${p}" ${REC ? "disabled" : ""}>${ico("mic")}Voice message</button>` : ""}
           ${SR ? `<button class="k-btn ${live ? "k-btn--live" : ""} t-minor-medium" data-a="dict" data-p="${tp}" data-note="${p}">${ico(live ? "stop" : "speak")}${live ? "Stop" : "Speak to type"}</button>`
                : `<button class="k-btn t-minor-medium" data-a="openTxt" data-p="${p}">${ico("kbd")}Type a note</button>`}</div>`;
      return wrap(`${(f.o || []).length ? `<div class="k-choice">${f.o.map(o => chip(o, (n.p || []).includes(o), false, "phrase")).join("")}</div>` : ""}${voice}
        ${(n.clips || []).length ? `<div class="clips">${n.clips.map((c, i) => `<div class="clip">${ico("mic", "svg--sm")}<audio controls preload="metadata" data-clip="${c.id}"></audio>
          <span class="t-subtext-regular quiet">${fmtDur(c.dur)}</span><button class="k-btn k-btn--ghost k-btn--danger" data-a="clipDel" data-p="${p}" data-v="${c.id}" aria-label="Delete voice message ${i + 1}">${ico("trash", "svg--sm")}</button></div>`).join("")}</div>` : ""}
        ${n.open || n.txt || live ? `<textarea class="k-inp t-minor-regular ${live ? "is-live" : ""}" data-a="txt" data-p="${tp}" placeholder="${live ? "Listening… speak now" : "Type here"}" rows="3">${esc(n.txt || "")}</textarea>`
          : SR ? `<button class="k-btn k-btn--ghost t-body-medium more-link" data-a="openTxt" data-p="${p}">${ico("kbd", "svg--sm")}Type instead</button>` : ""}`);
    }
    case "tasks": {
      const d = v || {}; const all = DAY_TASKS.flatMap(g => g[1]); const n = all.filter(t => d[t[0]]).length;
      return `<div class="bar-tools"><span class="k-pill ${n === all.length ? "k-pill--ok" : ""} t-body-medium">${n} of ${all.length} done</span></div>` + DAY_TASKS.map(([g, ts]) =>
        `<div class="k-field"><div class="k-field__l t-subtext-title" style="text-transform:uppercase;letter-spacing:.06em">${g}</div><div class="k-opts">${ts.map(([id, tm, t, s]) => `<button class="k-opt ${d[id] ? "is-on k-opt--done" : ""}" data-a="task" data-p="${p}/${id}" aria-pressed="${!!d[id]}">
          <span class="k-box">${ico("check")}</span><span class="k-opt__main"><span class="t-minor-medium">${esc(t)}</span><span class="t-subtext-regular quiet">${d[id] ? "Done at " + d[id] : "Planned " + tm}</span></span>
          ${s ? '<span class="k-opt__side"><span class="k-tag k-tag--safety t-subtext-title">Safety</span></span>' : ""}</button>`).join("")}</div></div>`).join("");
    }
    case "audit": {
      const items = auditItems(f, scopeData), d = v || {};
      if (!items.length) return wrap(`<div class="k-empty">${ico("clip")}<p class="t-body-regular">Choose what you checked on the previous step first.</p></div>`);
      const ok = items.filter((_, i) => d[i] === "OK").length, bad = items.filter((_, i) => d[i] === "Concern").length;
      return wrap(`<div class="bar-tools"><span class="t-body-regular quiet">${ok} OK · <span style="color:${bad ? "var(--md3-error)" : "inherit"}">${bad} concern${bad === 1 ? "" : "s"}</span> · ${items.length - ok - bad} left</span>
        <button class="k-btn t-body-medium" data-a="allOk" data-p="${p}" data-v="${items.length}">${ico("check", "svg--sm")}Mark rest OK</button></div>
        <div class="audit">${items.map((it, i) => `<div class="audit__row ${d[i] === "Concern" ? "is-bad" : ""}"><span class="t-minor-regular">${esc(it)}</span>
          <div class="k-seg">${["OK", "Concern"].map(o => `<button class="k-seg__b t-body-medium ${d[i] === o ? "is-on" : ""} ${o === "Concern" ? "is-bad" : ""}" data-a="seg" data-p="${p}/${i}" data-v="${o}" aria-pressed="${d[i] === o}">${o}</button>`).join("")}</div></div>`).join("")}</div>`);
    }
    case "roster": {
      const d = v || {}, list = zoneAnimals();
      const done = list.filter(a => d[a.id] && d[a.id].ate && d[a.id].h).length;
      return `<div class="bar-tools"><span class="k-pill ${done === list.length ? "k-pill--ok" : ""} t-body-medium">${done} of ${list.length} animals</span>
        <button class="k-btn t-body-medium" data-a="allNormal" data-p="${p}">${ico("check", "svg--sm")}All normal</button></div>
        ${VIEW.tried && done < list.length ? `<p class="t-body-medium" style="color:var(--md3-error)">Answer both questions for every animal.</p>` : ""}
        <div class="stack">${list.map(a => { const x = d[a.id] || {}; const bad = x.ate === "None" || x.h === "Concern"; const full = x.ate && x.h;
          const sg = (k, opts, badv) => `<div class="k-seg">${opts.map(o => `<button class="k-seg__b t-body-medium ${x[k] === o ? "is-on" : ""} ${badv.includes(o) ? "is-bad" : ""}" data-a="seg" data-p="${p}/${a.id}/${k}" data-v="${o}" aria-pressed="${x[k] === o}">${o}</button>`).join("")}</div>`;
          return `<div class="ani ${bad ? "is-bad" : full ? "is-ok" : ""}"><div class="ani__h"><span class="k-rowcard__ico ${bad ? "k-rowcard__ico--bad" : full ? "k-rowcard__ico--ok" : ""}">${ico(full && !bad ? "check" : "paw")}</span>
            <span class="k-rowcard__main"><span class="t-minor-title">${esc(a.name)}</span><span class="t-subtext-regular quiet">${esc(a.species)} · ${a.encl.code} ${esc(a.encl.name)}</span></span></div>
            <div class="ani__grid"><div><span class="ani__cap t-subtext-title">Ate</span>${sg("ate", ["All", "Part", "None"], ["None"])}</div><div><span class="ani__cap t-subtext-title">Health</span>${sg("h", ["OK", "Concern"], ["Concern"])}</div></div>
            ${x.h === "Concern" ? `<div class="k-field"><span class="t-subtext-title">What did you see?</span><div class="k-choice">${OBS_TAGS.map(o => chip(o, (x.tags || []).includes(o), true, "multi").replace(`data-p="${p}"`, `data-p="${p}/${a.id}/tags"`)).join("")}</div></div>
              ${fieldHTML({ t: "note", k: "note", l: "Note" }, `${p}/${a.id}/note`, x.note, r)}` : ""}</div>`; }).join("")}</div>`;
    }
    case "attend": {
      const d = v || {}, list = staffHere(); const n = list.filter(s => d[s.uid]).length;

      case "check": return "Yes";

      case "tasks": { const all = DAY_TASKS.flatMap(g => g[1]); const n = all.filter(t => (v || {})[t[0]]).length; const miss = all.filter(t => !(v || {})[t[0]]).map(t => t[2]);

/* =====================================================================
   VOICE — voice messages (kept as audio, in IndexedDB on this device) and speak-to-type (browser speech recognition).
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const CAN_REC = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const fmtDur = s => Math.floor((s || 0) / 60) + ":" + pad((s || 0) % 60);
const noteStr = v => !v ? "" : [...(v.p || []), (v.txt || "").trim(), (v.clips || []).length ? `🎤 ${v.clips.length} voice message${v.clips.length > 1 ? "s" : ""}` : ""].filter(Boolean).join(". ");
const clipsOf = o => !o || typeof o !== "object" ? [] : Object.entries(o).flatMap(([k, v]) => k === "clips" && Array.isArray(v) ? v : clipsOf(v));
const clipPlayers = v => { const c = clipsOf(v); return c.length ? `<div class="sum-clips">${c.map(x => `<audio controls preload="metadata" data-clip="${x.id}"></audio>`).join("")}</div>` : ""; };
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const q = indexedDB.open("drs-lite-audio", 1); q.onupgradeneeded = () => q.result.createObjectStore("clips"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction("clips", mode); const q = fn(t.objectStore("clips")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { put: (id, b) => tx("readwrite", st => st.put(b, id)), get: id => tx("readonly", st => st.get(id)), del: id => tx("readwrite", st => st.delete(id)).catch(() => {}) };
})();
const CLIPURL = {};
function hydrateClips() {
  document.querySelectorAll("audio[data-clip]").forEach(async el => {
    const id = el.dataset.clip;
    if (!CLIPURL[id]) { try { const b = await IDB.get(id); if (b) CLIPURL[id] = URL.createObjectURL(b); } catch (e) {} }
    if (!CLIPURL[id] && API) { try { const res = await api("clips/" + id); if (res.ok) { const b = await res.blob(); CLIPURL[id] = URL.createObjectURL(b); IDB.put(id, b).catch(() => {}); } } catch (e) {} }
    if (CLIPURL[id]) el.src = CLIPURL[id];
    else { const s = document.createElement("span"); s.className = "t-body-regular quiet"; s.textContent = "Voice message not on this device"; el.replaceWith(s); }
  });
}
const renderIfForm = () => { if (VIEW.name === "form") renderForm(); };

let REC = null;
async function startRec(p) {
  if (REC) return;
  stopDict();
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast("Microphone blocked. Allow it in your browser settings."); }
  const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  let mr; try { mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined); } catch (e) { stream.getTracks().forEach(t => t.stop()); return toast("Voice recording is not supported here"); }
  const chunks = [], rid = VIEW.id, t0 = Date.now();
  REC = { p, mr, t0 };
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(REC && REC.tick);
    const dur = Math.round((Date.now() - t0) / 1000), blob = new Blob(chunks, { type: mr.mimeType || mime || "audio/webm" }); REC = null;
    if (dur < 1 || !blob.size) { toast("Too short. Hold on a little longer."); return renderIfForm(); }
    const id = "clip-" + uid();
    try { await IDB.put(id, blob); } catch (e) { toast("Could not save the voice message on this device"); return renderIfForm(); }
    const r = report(rid); const clips = (getP(r.data, p + "/clips") || []).slice(); clips.push({ id, dur, type: blob.type }); setP(r.data, p + "/clips", clips); save(r);
    toast("Voice message saved"); renderIfForm();
  };
  mr.start(1000);
  REC.tick = setInterval(() => { const sec = Math.floor((Date.now() - t0) / 1000); document.querySelectorAll("[data-rec-t]").forEach(el => el.textContent = fmtDur(sec)); if (sec >= 180) stopRec(); }, 250);
  renderForm();
}
function stopRec() { if (REC && REC.mr.state !== "inactive") REC.mr.stop(); }

let DICT = null;
function startDict(p, notePath) {
  if (DICT) { const same = DICT.p === p; stopDict(); if (same) return; }
  if (REC) return toast("Stop the recording first");
  const r = cur(); if (notePath) setP(r.data, notePath + "/open", true);
  const rec = new SR(); rec.lang = navigator.language || "en-IN"; rec.continuous = true; rec.interimResults = true;
  const base = (getP(r.data, p) || "").trim(); let fin = "";
  DICT = { p, rec };
  rec.onresult = e => {
    let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t.trim() + " "; else interim += t; }
    const el = document.querySelector(`[data-a="txt"][data-p="${p}"]`); if (el) el.value = [base, (fin + interim).trim()].filter(Boolean).join(" ");
    setP(r.data, p, [base, fin.trim()].filter(Boolean).join(" ")); save(r);
  };
  rec.onerror = e => { toast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Microphone blocked. Allow it in your browser settings." : e.error === "network" ? "Speak-to-type needs signal. Record a voice message instead." : e.error === "no-speech" ? "Didn't hear anything. Try again." : "Speak-to-type stopped"); };
  rec.onend = () => { if (DICT && DICT.rec === rec) { DICT = null; renderIfForm(); } };
  try { rec.start(); } catch (e) { DICT = null; return toast("Could not start speak-to-type"); }
  renderForm();
  const el = document.querySelector(`[data-a="txt"][data-p="${p}"]`); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}
function stopDict() { if (DICT) { const d = DICT; DICT = null; try { d.rec.stop(); } catch (e) {} renderIfForm(); } }
function stopVoice() { stopRec(); if (DICT) { const d = DICT; DICT = null; try { d.rec.stop(); } catch (e) {} } }

   ===================================================================== */
const API = location.protocol.startsWith("http") ? "api/" : null;   // opened as a file: no team store
let SYNC = { state: API ? "idle" : "off", at: 0 };
const api = (path, opts = {}) => fetch(API + path, Object.assign({}, opts, { headers: Object.assign({ "x-team-code": DB.code || "" }, opts.headers || {}) }));
const teamScope = () => me().role === "keeper" ? { site: me().site, zone: me().zone } : { site: me().site };   // keepers: their zone; everyone else: the whole site
let syncing = null;
function sync(manual) {
  if (!API || !me()) return Promise.resolve();
  if (syncing) return syncing;
  if (!navigator.onLine) { SYNC.state = "offline"; refreshLists(); return Promise.resolve(); }
  syncing = (async () => {
    try {
      /* 1 · outbox: voice messages first, then the report itself */
      for (const id of DB.outbox.slice()) {
        const r = DB.reports.find(x => x.id === id);
        if (!r || r.status !== "sent") { DB.outbox = DB.outbox.filter(x => x !== id); continue; }
        r.up = r.up || {};
        for (const c of clipsOf(r.data)) {
          if (r.up[c.id]) continue;
          const b = await IDB.get(c.id).catch(() => null); if (!b) { r.up[c.id] = "missing"; continue; }
          const res = await api("clips/" + c.id, { method: "PUT", headers: { "content-type": (b.type || "audio/webm").split(";")[0] }, body: b });
          if (!res.ok) throw Object.assign(new Error("clip"), { status: res.status });
          r.up[c.id] = 1; persist();
        }
        const { up, ...body } = r;
        const res = await api("reports", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ reports: [body] }) });
        if (!res.ok) throw Object.assign(new Error("report"), { status: res.status });
        DB.outbox = DB.outbox.filter(x => x !== id); persist();
      }
      /* 2 · team: everything new since the last pull, for my site (keepers: my zone) */
      const sc = teamScope(), key = sc.site + "|" + (sc.zone || "*");
      if (DB.teamKey !== key) { DB.team = []; DB.teamAt = 0; DB.teamKey = key; }
      const res = await api(`reports?site=${sc.site}${sc.zone ? "&zone=" + sc.zone : ""}&since=${Math.max(0, (DB.teamAt || 0) - 60000)}`);
      if (!res.ok) throw Object.assign(new Error("pull"), { status: res.status });
      const j = await res.json(), byId = {};
      DB.team.forEach(r => byId[r.id] = r);
      j.reports.forEach(r => { if (r.by !== me().uid) byId[r.id] = r; });
      const keepFrom = dayKey(new Date(Date.now() - 3 * 864e5));
      DB.team = Object.values(byId).filter(r => r.date >= keepFrom).sort((a, b) => (b.sentAt || 0) - (a.sentAt || 0));
      DB.teamAt = j.now; persist();
      SYNC = { state: "ok", at: Date.now() };
      if (manual) toast("Up to date");
    } catch (e) {
      SYNC.state = e.status === 401 ? "locked" : navigator.onLine ? "error" : "offline";
      if (manual && SYNC.state === "error") toast("Could not reach the team. Your reports are safe on this phone.");
    } finally { syncing = null; refreshLists(); }
  })();
  return syncing;
}
function refreshLists() {   /* redraw list screens with fresh data, never while someone is typing or a sheet is open */
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA/.test(a.tagName);
  if (["home", "team", "history"].includes(VIEW.name) && $("scrim").hidden && !typing) render();
}
if (API) {
  setInterval(() => { if (document.visibilityState === "visible") sync(); }, 20000);
  addEventListener("online", () => sync());
  addEventListener("offline", () => { SYNC.state = "offline"; refreshLists(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });
}

/* ---------- team: flagged first, who still owes a daily report, everything sent ---------- */
function renderTeam() {
  const sc = teamScope(), day = TEAMDAY || TODAY();
  const list = DB.team.filter(r => r.date === day && r.site === sc.site && (!sc.zone || r.zone === sc.zone));
  const flagged = list.map(r => [r, flagsOf(r)]).filter(x => x[1].length).sort((a, b) => b[1].length - a[1].length);
  const people = ANTS.staff.filter(p => p.site === sc.site && p.uid !== me().uid && (!sc.zone || p.zone === sc.zone));
  const st = SYNC.state, ago = SYNC.at ? new Date(SYNC.at).toTimeString().slice(0, 5) : "";
  const status = !API ? "Open the hosted app to see your team" : st === "ok" ? `Live · updated ${ago}` : st === "offline" ? `No signal · showing the last update${DB.teamAt ? " from " + new Date(DB.teamAt).toTimeString().slice(0, 5) : ""}`
    : st === "locked" ? "Team code needed" : st === "error" ? "Could not reach the team" : "Connecting…";
  const row = (r, fl) => { const F = FORMS[r.form], p = ANTS.staff.find(x => x.uid === r.by);
    return `<button class="k-rowcard" data-a="teamView" data-v="${r.id}"><span class="k-rowcard__ico ${fl.length ? "k-rowcard__ico--bad" : "k-rowcard__ico--ok"}">${ico(fl.length ? "alert" : F.icon)}</span>
      <span class="k-rowcard__main"><span class="k-rowcard__t t-minor-title">${esc(p ? p.name : r.by)}</span>
        <span class="k-rowcard__meta t-body-regular quiet">${F.title}${subtitle(r) !== F.title ? " · " + esc(subtitle(r)) : ""} · ${r.sentAt ? new Date(r.sentAt).toTimeString().slice(0, 5) : ""}</span>
        ${fl.length ? `<span class="t-body-medium" style="color:var(--md3-error)">${esc(fl.slice(0, 2).join(" · "))}${fl.length > 2 ? ` · +${fl.length - 2} more` : ""}</span>` : ""}</span>
      <span class="k-rowcard__side">${ico("chev")}</span></button>`; };
  const owed = people.map(p => { const forms = ROLES[p.role].forms.filter(f => FORMS[f].per === "day");
    return [p, forms.map(f => [f, list.some(r => r.by === p.uid && r.form === f)])]; }).filter(x => x[1].length);
  const days = [TODAY(), dayKey(new Date(Date.now() - 864e5))];
  $("main").innerHTML = `<header class="k-ph"><div class="k-ph__main"><h1 class="t-major-title" style="color:var(--md3-on-surface)">Team</h1>
      <p class="k-ph__line t-body-regular"><span>${esc(site(sc.site).name)}</span><span>${sc.zone ? esc(zoneOf(sc.site, sc.zone).name) : "All zones"}</span></p></div>
      ${API ? `<button class="k-btn t-body-medium" data-a="syncNow" aria-label="Refresh">${ico("hist", "svg--sm")}Refresh</button>` : ""}</header>
    <div class="gap24">
      <div class="bar-tools"><span class="k-pill ${st === "ok" ? "k-pill--ok" : st === "locked" || st === "error" ? "k-pill--bad" : "k-pill--warn"} t-body-medium">${esc(status)}</span>
        <div class="k-seg" role="tablist">${days.map(d => `<button class="k-seg__b t-body-medium ${d === day ? "is-on" : ""}" data-a="teamDay" data-v="${d}" aria-selected="${d === day}">${fmtDay(d)}</button>`).join("")}</div></div>
      ${st === "locked" ? `<section class="k-card k-card--pad stack"><p class="t-minor-title">Enter your team code</p><p class="t-body-regular quiet">Your supervisor has it. You only need to enter it once on this phone.</p>
        <div class="txtrow"><input id="teamCode" class="k-inp t-minor-regular" autocomplete="off" autocapitalize="off" placeholder="Team code" value="${esc(DB.code || "")}"><button class="k-btn k-btn--primary t-body-medium" style="width:auto;padding:0 16px" data-a="setCode">Save</button></div></section>` : ""}
      ${!API ? `<div class="k-empty">${ico("users")}<p class="t-minor-medium">Team view needs the hosted app</p><p class="t-body-regular quiet">Open the app from its web link to send reports to your team and see theirs.</p></div>` : `
      ${flagged.length ? `<section><div class="sec-h"><h2 class="t-minor-title" style="color:var(--md3-error)">Needs attention · ${flagged.length}</h2></div><div class="stack">${flagged.map(([r, fl]) => row(r, fl)).join("")}</div></section>` : ""}
      ${owed.length ? `<section><div class="sec-h"><h2 class="t-minor-title">Daily reports</h2><span class="t-body-regular quiet">${owed.reduce((n, x) => n + x[1].filter(y => y[1]).length, 0)} of ${owed.reduce((n, x) => n + x[1].length, 0)} sent</span></div>
        <div class="k-card">${owed.map(([p, fs]) => `<div class="owe-row"><span class="avatar t-subtext-title">${initials(p.name)}</span>
          <span class="owe-row__who t-body-medium">${esc(p.name)}<span class="t-subtext-regular quiet" style="display:block">${ROLES[p.role].l} · ${esc(zoneOf(p.site, p.zone).name)}</span></span>
          <span class="k-choice" style="gap:4px">${fs.map(([f, ok]) => `<span class="k-pill ${ok ? "k-pill--ok" : ""} t-subtext-title">${ok ? ico("check", "svg--sm") : ""}${FORMS[f].title.replace(/ (report|log|round)$/i, "")}</span>`).join("")}</span></div>`).join("")}</div></section>` : ""}
      <section><div class="sec-h"><h2 class="t-minor-title">All sent reports</h2><span class="t-body-regular quiet">${list.length}</span></div>
        ${list.length ? `<div class="stack">${list.map(r => row(r, flagsOf(r))).join("")}</div>` : `<div class="k-empty">${ico("users")}<p class="t-minor-medium">Nothing sent ${day === TODAY() ? "yet today" : "that day"}</p><p class="t-body-regular quiet">Reports appear here as soon as your team sends them.</p></div>`}</section>`}
    </div>`;
  $("bar").innerHTML = tabbar("team");
}
let TEAMDAY = null;

/* =====================================================================
   SHARE — WhatsApp-friendly plain text
   ===================================================================== */
function reportText(r) { return withR(r, () => reportTextIn(r)); }
function reportTextIn(r) {
  const F = FORMS[r.form], by = ANTS.staff.find(s => s.uid === r.by), flags = flagsIn(F, r.data);
  const tmp = document.createElement("div"); tmp.innerHTML = summaryHTML(r);
  const lines = [`*${F.title}*`, `${fmtDay(r.date)} · ${by ? by.name : r.by} · ${site(r.site).name} / ${zoneOf(r.site, r.zone).name}`, ""];
  if (flags.length) lines.push(`⚠ *${flags.length} flag${flags.length > 1 ? "s" : ""}*`, ...flags.map(f => "• " + f), "");
  tmp.querySelectorAll(".sum-sec").forEach(sec => {
    lines.push(`*${sec.querySelector("h3").textContent}*`);
    sec.querySelectorAll(".k-kv").forEach(kv => { const head = kv.closest(".sum-item") && kv.parentElement.querySelector("p"); if (head) lines.push(`_${head.textContent}_`);
      const dt = kv.querySelectorAll("dt"), dd = kv.querySelectorAll("dd"); dt.forEach((t, i) => { if (dd[i].textContent !== "—") lines.push(`${t.textContent}: ${dd[i].textContent}`); }); });
    lines.push("");
  });
  return lines.join("\n").trim();
}
let SHARE = { id: null, files: [] };
async function prepareShare(r) {
  SHARE = { id: r.id, files: [] };
  const ext = t => t.includes("mp4") ? "m4a" : t.includes("ogg") ? "ogg" : "webm";
  const files = await Promise.all(clipsOf(r.data).map(async (c, i) => { try { const b = await IDB.get(c.id); return b ? new File([b], `voice-${i + 1}.${ext(b.type)}`, { type: b.type }) : null; } catch (e) { return null; } }));
  if (SHARE.id === r.id) SHARE.files = files.filter(Boolean);
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast("Copied. Paste it in WhatsApp or email."); } catch (e) { toast("Could not copy on this device"); } }

/* =====================================================================
   EVENTS — one delegated handler
   ===================================================================== */
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }
const cur = () => report(VIEW.id);
function save(r) { r.updated = Date.now(); persist(); }
function fieldAt(r, p) {
  const ks = p.split("/"); const F = FORMS[r.form]; const s = F.sections.find(x => x.k === ks[0]); let f = s.fields.find(x => x.k === ks[1]);
  for (let i = 2; f && f.t === "group" && i + 1 < ks.length; i += 2) f = f.fields.find(x => x.k === ks[i + 1]);
  return f;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, p = b.dataset.p, v = b.dataset.v, r = VIEW.id ? cur() : null;
  switch (a) {
    /* onboarding + navigation */
    case "obRole": OB = { role: v, uid: null }; return renderOnboard();
    case "obWho": OB.uid = v; OB.zone = null; return renderOnboard();
    case "obZone": OB.zone = v; return renderOnboard();
    case "obGo": { const s = ANTS.staff.find(x => x.uid === OB.uid); DB.me = { uid: s.uid, role: s.role, site: s.site, zone: OB.zone || s.zone }; persist(); return go({ name: "home" }); }
    case "go": return go({ name: v });
    case "new": { const F = FORMS[v]; const ex = F.per === "day" && todays(v)[0]; const rr = ex || newReport(v); return go({ name: ex && ex.status === "sent" ? "review" : "form", id: rr.id, step: 0 }); }
    case "open": { const rr = report(v); return go({ name: rr.status === "sent" ? "review" : "form", id: v, step: 0 }); }
    case "view": { const rr = report(v); return go({ name: rr.status === "sent" ? "review" : "form", id: v, step: 0, from: "history" }); }
    case "teamView": return go({ name: "review", id: v, from: "team" });
    case "setCode": { const el = $("teamCode"); DB.code = (el && el.value || "").trim(); persist(); SYNC.state = "busy"; render(); return sync(); }
    case "syncNow": return sync(true);
    case "teamDay": TEAMDAY = v; return renderTeam();
    case "step": stopVoice(); VIEW = { name: "form", id: VIEW.id, step: +v, tried: VIEW.tried }; render(); return window.scrollTo(0, 0);
    case "fix": stopVoice(); VIEW = { name: "form", id: VIEW.id, step: +v, tried: true }; render(); return window.scrollTo(0, 0);
    case "review": stopVoice(); VIEW = { name: "review", id: v, tried: true }; render(); return window.scrollTo(0, 0);
    case "send": { const F = FORMS[r.form]; if (missingIn(F, r.data).length) return; r.status = "sent"; r.sentAt = Date.now(); save(r);
      const fl = flagsIn(F, r.data).length;
      if (API) { if (!DB.outbox.includes(r.id)) DB.outbox.push(r.id); persist(); sync(); }
      toast(!API ? (fl ? `Saved. ${fl} flag${fl > 1 ? "s" : ""} raised.` : "Report saved")
        : navigator.onLine ? (fl ? `Sending. ${fl} flag${fl > 1 ? "s" : ""} raised for your supervisor.` : "Sending to your team")
        : "No signal. It will send by itself when you're back in range.");
      return go({ name: "review", id: r.id }); }
    case "discard": if (confirm("Discard this draft? This cannot be undone.")) { clipsOf(report(v).data).forEach(c => IDB.del(c.id)); DB.reports = DB.reports.filter(x => x.id !== v); persist(); toast("Draft discarded"); go({ name: "home" }); } return;
    case "share": { const t = reportText(report(v)); if (!navigator.share) return copyText(t);
      const data = { title: FORMS[report(v).form].title, text: t }, files = SHARE.id === v ? SHARE.files : [];
      if (files.length && navigator.canShare && navigator.canShare({ files })) data.files = files;
      try { await navigator.share(data); } catch (err) {} return; }
    case "copy": return copyText(reportText(report(v)));
    case "setZone": DB.me.zone = v; persist(); toast("Zone changed"); return render();
    case "signout": DB.me = null; OB = { role: null, uid: null }; persist(); return render();
    case "wipe": if (confirm("Delete every report saved on this device?")) { DB.reports.forEach(x => clipsOf(x.data).forEach(c => IDB.del(c.id))); DB.reports = []; DB.outbox = []; persist(); toast("All reports cleared"); render(); } return;

    /* answers */
    case "seg": { const old = getP(r.data, p); setP(r.data, p, old === v ? undefined : v); save(r); return renderForm(); }
    case "multi": case "phrase": {
      const path = a === "phrase" ? p + "/p" : p; const arr = (getP(r.data, path) || []).slice(); const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else { if (v === "None" || v === "Normal") arr.length = 0; else { ["None", "Normal"].forEach(x => { const j = arr.indexOf(x); if (j >= 0) arr.splice(j, 1); }); } arr.push(v); }
      setP(r.data, path, arr); save(r); return renderForm(); }
    case "check": setP(r.data, p, !getP(r.data, p)); save(r); return renderForm();
    case "task": setP(r.data, p, getP(r.data, p) ? undefined : nowHM()); save(r); return renderForm();
    case "now": setP(r.data, p, nowHM()); save(r); toast("Time set to now"); return renderForm();
    case "num": { const f = fieldAt(r, p); const n = Math.max(f.min || 0, (+getP(r.data, p) || 0) + (+v)); setP(r.data, p, n); save(r); return renderForm(); }
    case "rec": return startRec(p);
    case "recStop": return stopRec();
    case "dict": return startDict(p, b.dataset.note);
    case "clipDel": { if (!confirm("Delete this voice message?")) return; const cl = (getP(r.data, p + "/clips") || []).filter(c => c.id !== v); setP(r.data, p + "/clips", cl); save(r); IDB.del(v); return renderForm(); }
    case "openTxt": setP(r.data, p + "/open", true); save(r); renderForm(); { const t = document.querySelector(`textarea[data-p="${p}/txt"]`); if (t) t.focus(); } return;
    case "allOk": { for (let i = 0; i < +v; i++) if (!getP(r.data, p + "/" + i)) setP(r.data, p + "/" + i, "OK"); save(r); return renderForm(); }
    case "allNormal": { zoneAnimals().forEach(an => { const x = getP(r.data, p + "/" + an.id) || {}; if (!x.ate) x.ate = "All"; if (!x.h) x.h = "OK"; setP(r.data, p + "/" + an.id, x); }); save(r); toast("Unanswered animals marked normal"); return renderForm(); }
    case "allPresent": { staffHere().forEach(s => { if (!getP(r.data, p + "/" + s.uid)) setP(r.data, p + "/" + s.uid, "Present"); }); save(r); return renderForm(); }
    case "addItem": { const g = fieldAt(r, p); const arr = getP(r.data, p) || []; arr.push(seedItem(g)); setP(r.data, p, arr); save(r); renderForm();
      const cards = document.querySelectorAll(".grp"); if (cards.length) cards[cards.length - 1].scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    case "delItem": { const arr = getP(r.data, p) || []; const g = fieldAt(r, p);
      if (Object.keys(arr[+v] || {}).length > 1 && !confirm(`Remove ${g.item} ${+v + 1}?`)) return; arr.splice(+v, 1); save(r); return renderForm(); }

    /* time sheet */
    case "time": { const f = fieldAt(r, p); SHEET = { kind: "time", p, label: f.l, val: getP(r.data, p) || nowHM() }; return timeSheet(); }
    case "tH": { const m = SHEET.val.split(":")[1]; SHEET.val = pad(v) + ":" + m; return timeSheet(); }
    case "tM": { const h = SHEET.val.split(":")[0]; SHEET.val = h + ":" + pad(v); setP(r.data, SHEET.p, SHEET.val); save(r); closeSheet(); return renderForm(); }
    case "tAgo": { const d = new Date(Date.now() - v * 6e4); SHEET.val = pad(d.getHours()) + ":" + pad(d.getMinutes()); setP(r.data, SHEET.p, SHEET.val); save(r); closeSheet(); return renderForm(); }
    case "tDone": setP(r.data, SHEET.p, SHEET.val); save(r); closeSheet(); return renderForm();

    /* list sheet */
    case "pick": { const f = fieldAt(r, p); const cv = getP(r.data, p); SHEET = { kind: "pick", p, src: f.src, multi: !!f.multi, label: f.l, sel: f.multi ? (cv || []).slice() : cv ? [cv] : [] }; return pickSheet(); }
    case "pickOne": if (SHEET.multi) { const i = SHEET.sel.indexOf(v); i >= 0 ? SHEET.sel.splice(i, 1) : SHEET.sel.push(v); const y = $("sheet").querySelector(".k-sheet__b").scrollTop; pickSheet(); $("sheet").querySelector(".k-sheet__b").scrollTop = y; return; }
      setP(r.data, SHEET.p, v); save(r); closeSheet(); return renderForm();
    case "pickClear": SHEET.sel = []; return pickSheet();
    case "pickDone": setP(r.data, SHEET.p, SHEET.sel.slice()); save(r); closeSheet(); return renderForm();
    case "sheetX": return closeSheet();
  }
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset.a !== "txt") return; const r = cur(); if (!r) return; setP(r.data, el.dataset.p, el.value); save(r); });

render();
sync();
/* offline: when hosted (https), a service worker keeps the app and fonts on the phone so it opens with no signal */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
